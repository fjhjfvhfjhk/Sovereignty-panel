<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель сервера</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="theme-color" content="#6366f1">

    <script>
    /*
     * Загрузчик skinview3d.
     * Порядок источников:
     *   1. jsdelivr (обычно работает лучше всего)
     *   2. unpkg (зеркало)
     *   3. cdnjs (третий CDN)
     *   4. локальный skinview3d.bundle.js в корне репозитория — если всё заблокировано
     */
    (function () {
        var cdns = [
            'https://cdn.jsdelivr.net/npm/skinview3d@3/bundles/skinview3d.bundle.js',
            'https://unpkg.com/skinview3d@3/bundles/skinview3d.bundle.js',
            'https://cdnjs.cloudflare.com/ajax/libs/skinview3d/3.4.2/skinview3d.bundle.min.js',
            'skinview3d.bundle.js'
        ];
        window.__skinview3dStatus = 'loading';
        window.__skinview3dSource = null;
        var i = 0;

        function done(src) {
            window.__skinview3dStatus = 'loaded';
            window.__skinview3dSource = src;
            console.log('[skinview3d] Загружен: ' + src);
        }

        function tryNext() {
            if (i >= cdns.length) {
                window.__skinview3dStatus = 'failed';
                console.error('[skinview3d] ВСЕ источники недоступны. Скачай skinview3d.bundle.js ' +
                    'с https://cdn.jsdelivr.net/npm/skinview3d@3/bundles/skinview3d.bundle.js и положи ' +
                    'в корень репозитория как skinview3d.bundle.js');
                return;
            }
            var src = cdns[i++];
            console.log('[skinview3d] Пробую: ' + src);
            var s = document.createElement('script');
            s.src = src;
            s.async = false;
            s.onload = function () {
                if (typeof skinview3d !== 'undefined') {
                    done(src);
                } else {
                    console.warn('[skinview3d] Загрузился, но объект не найден: ' + src);
                    tryNext();
                }
            };
            s.onerror = function () {
                console.warn('[skinview3d] Ошибка сети: ' + src);
                tryNext();
            };
            document.head.appendChild(s);
        }
        tryNext();
    })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-row">
                <h1 id="server-name">Загрузка...</h1>
                <nav class="main-nav">
                    <button class="nav-btn active" data-tab="overview">🏠 Обзор</button>
                    <button class="nav-btn" data-tab="map">🗺️ Карта</button>
                    <button class="nav-btn" data-tab="players">👥 Игроки</button>
                    <button class="nav-btn" data-tab="guide">📖 Гайд</button>
                    <button class="nav-btn" data-tab="commands">⌨️ Команды</button>
                    <button class="nav-btn" data-tab="bonus">🎁 Бонусы</button>
                </nav>
            </div>
            <div class="header-meta">
                <span class="badge" id="online-badge">Онлайн: —</span>
                <span class="badge" id="updated-badge">Обновлено: —</span>
                <button class="badge btn-badge" id="refresh-btn">🔄 Обновить</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="tab-content active" id="tab-overview">
            <section class="stats-grid">
                <div class="stat-card"><div class="stat-icon">🏛️</div><div class="stat-value" id="countries-count">—</div><div class="stat-label">Стран</div></div>
                <div class="stat-card"><div class="stat-icon">🗺️</div><div class="stat-value" id="total-claims">—</div><div class="stat-label">Всего чанков</div></div>
                <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="total-bank">—</div><div class="stat-label">Общая казна</div></div>
                <div class="stat-card"><div class="stat-icon">⚡</div><div class="stat-value" id="total-energy">—</div><div class="stat-label">Энергия лидеров</div></div>
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value" id="total-players">—</div><div class="stat-label">Игроков</div></div>
            </section>

            <section class="panel">
                <h2>🏆 Топ стран</h2>
                <div class="tabs">
                    <button class="tab active" data-sort="claims">По территории</button>
                    <button class="tab" data-sort="bank">По казне</button>
                    <button class="tab" data-sort="energy">По энергии</button>
                    <button class="tab" data-sort="allies">По союзам</button>
                </div>
                <div class="table-wrap">
                    <table id="countries-table">
                        <thead><tr><th>#</th><th>Страна</th><th>Лидер</th><th>Чанков</th><th>Казна</th><th>Энергия</th><th>Союзы</th><th>Пакты</th></tr></thead>
                        <tbody id="countries-body"><tr><td colspan="8" class="loading">Загрузка данных...</td></tr></tbody>
                    </table>
                </div>
            </section>

            <section class="panel" id="country-details" style="display:none;">
                <h2 id="detail-title">Детали страны</h2>
                <div class="detail-grid" id="detail-content"></div>
            </section>
        </section>

        <section class="tab-content" id="tab-map">
            <section class="panel">
                <div class="panel-header">
                    <h2>🗺️ Карта территорий</h2>
                    <div class="map-controls">
                        <button class="map-btn" id="map-reset">Сбросить вид</button>
                        <button class="map-btn" id="map-clear-highlight">Снять выделение</button>
                        <label class="map-toggle">
                            <input type="checkbox" id="map-show-players" checked>
                            <span>👤 Игроки</span>
                        </label>
                        <span class="map-hint">Клик по стране → детали • Колёсико — зум</span>
                    </div>
                </div>
                <div class="map-viewport" id="map-viewport">
                    <canvas id="map-canvas"></canvas>
                    <div class="map-overlay" id="map-overlay"></div>
                    <div class="map-place
